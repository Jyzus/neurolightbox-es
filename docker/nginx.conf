server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Filenames have no content hash: revalidate before reusing cached responses.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    etag on;

    # PNG assets are already compressed; compress only text responses.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Missing Worker scripts/assets must return 404, never the home page.
    location / {
        try_files $uri $uri/ =404;
    }
}
